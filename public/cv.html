<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>Adham Raafat Sakoury | CV</title>
  <link rel="icon" type="image/png" href="/favicon1.png?v=2">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #0b1220;
    }

    .viewer {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100vh;
      height: 100dvh;
    }

    .viewer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      min-height: 56px;
      padding: 0.6rem 1rem;
      color: #f3f7ff;
      background: #111c2e;
      border-bottom: 1px solid #26364f;
    }

    .viewer-title {
      overflow: hidden;
      font-size: 0.95rem;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .download-link {
      flex: 0 0 auto;
      padding: 0.55rem 0.9rem;
      color: #fff;
      background: #1769d2;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
    }

    .download-link:hover {
      background: #0e57b5;
    }

    .pdf-frame {
      flex: 1;
      width: 100%;
      min-height: 0;
      border: 0;
      background: #fff;
    }
  </style>
</head>
<body>
  <main class="viewer">
    <header class="viewer-header">
      <span class="viewer-title">Adham Raafat Sakoury — CV</span>
      <a class="download-link" href="/assets/cv/Adham_Raafat_CV.pdf" download>
        Download PDF
      </a>
    </header>
    <iframe
      class="pdf-frame"
      src="/assets/cv/Adham_Raafat_CV.pdf"
      title="Adham Raafat Sakoury CV">
    </iframe>
  </main>
</body>
</html>
