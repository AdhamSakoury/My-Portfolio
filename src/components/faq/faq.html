<section id="faq" class="faq section">

  <div class="container section-title">
    <h2>Questions & Answers</h2>
    <p>
      Quick answers about my skills, projects, availability and contact details.
    </p>
  </div>

  <div class="container">

    <div class="row justify-content-center">

      <div class="col-lg-12">

        <div class="faq-container">

          @for (item of faqItems; track item.question; let index = $index) {

          <div
            class="faq-item"
            [class.faq-active]="isQuestionOpen(index)">

            <button
              type="button"
              class="qa-question"
              [attr.aria-expanded]="isQuestionOpen(index)"
              (click)="toggleQuestion(index)">

              <span class="question-label">Q</span>

              <span class="qa-question-text">
                {{ item.question }}
              </span>

              <i
                class="qa-toggle bi"
                [class.bi-chevron-down]="isQuestionOpen(index)"
                [class.bi-chevron-right]="!isQuestionOpen(index)">
              </i>

            </button>

            @if (isQuestionOpen(index)) {

            <div class="qa-answer">
              <p>
                <span class="answer-label">A</span>
                <span>{{ item.answer }}</span>
              </p>
            </div>

            }

          </div>

          }

        </div>

      </div>

    </div>

  </div>

</section>
